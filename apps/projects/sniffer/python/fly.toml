app = "portfolio-sniffer-api"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  SNIFFER_CORS_ORIGINS = "https://abnerportfolio.site,https://www.abnerportfolio.site"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
