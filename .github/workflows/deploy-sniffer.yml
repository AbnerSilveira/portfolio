name: Deploy Sniffer API (Fly.io)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/projects/sniffer/python/**"
      - ".github/workflows/deploy-sniffer.yml"

jobs:
  deploy-sniffer-api:
    name: Deploy sniffer API to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-sniffer-api
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/projects/sniffer/python
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # CWD = pasta do app: fly.toml e Dockerfile no mesmo dir (evita --config relativo à raiz quebrar).
      - run: flyctl deploy . --local-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SNIFFER_API_TOKEN }}
