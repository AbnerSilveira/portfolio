name: Deploy Services (Fly.io)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/sandbox-runner/**"
      - "packages/**"
      - "pnpm-lock.yaml"

jobs:
  deploy-sandbox-runner:
    name: Deploy sandbox-runner to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-sandbox-runner
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Build no runner do GitHub (Docker nativo) + push via flyctl.
      # Deploy tokens não conseguem acordar/criar o remote builder Fly — --local-only evita isso.
      # Contexto na raiz do monorepo; ver https://fly.io/docs/launch/monorepo/
      - run: flyctl deploy . --local-only --depot=false --dockerfile services/sandbox-runner/Dockerfile --config services/sandbox-runner/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
