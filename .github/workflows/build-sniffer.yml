name: Build Sniffer Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/projects/sniffer/python/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/projects/sniffer/python
          file: apps/projects/sniffer/python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-sniffer:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-sniffer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
